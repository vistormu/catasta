[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "catasta"
version = "0.5.2"
authors = [
  { name="vistor" },
]
description = "_Catasta_ is a Python library designed to simplify the process of Machine Learning model experimentation. Optimization, training, evaluation and inference all in one place!"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "pandas",
    "torch",
    "gpytorch",
    "einops",
    "scipy",
    "pillow",
    "optuna",
]

[tool.hatch.build.targets.wheel]
packages = ["catasta"]

[tool.hatch.build.targets.sdist]
include = [
    "catasta",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.hatch.build]
exclude = [
    "/.venv/",
    "/.venv-test/",
    "/.venv-macos/",
    "/dist/",
    "/build/",
    "*.egg-info",
    "**/__pycache__/",
]

[project.urls]
Homepage = "https://github.com/vistormu/catasta"
Issues = "https://github.com/vistormu/catasta/issues"
